<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vers Libre Image Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Radial:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" crossorigin="anonymous"></script>
    <!-- Note: Add proper SRI hash for security -->
</head>
<body>
    <div class="container">
        <div class="header">
            <h3><img src="vers-libre-logo.png" alt="Vers Libre" class="header-logo"> Image Editor</h3>
        </div>

        <div class="editor-container">
            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>📤 Upload</h3>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📤</div>
                        <p><strong>Click to upload</strong> or drag & drop</p>
                        <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">
                            Supports JPG, PNG, GIF, HEIC
                        </p>
                    </div>
                    <input type="file" id="imageInput" accept="image/*,.heic,.heif" style="display: none;">
                </div>

                <div class="sidebar-section">
                    <h3>✏️ Text</h3>
                    <div class="text-fields">
                        <div class="text-field-item">
                            <label for="titleLine1" class="text-field-label">Line 1</label>
                            <input type="text" id="titleLine1" placeholder="RADIO SHOW GOES HERE" maxlength="40" aria-label="Event title line 1">
                        </div>
                        <div class="text-field-item">
                            <label for="titleLine2" class="text-field-label">Line 2</label>
                            <input type="text" id="titleLine2" placeholder="FEAT. GUEST NAME" maxlength="40" aria-label="Event title line 2">
                        </div>
                        <div class="text-field-item">
                            <label for="dateInput" class="text-field-label">Date</label>
                            <input type="date" id="dateInput" aria-label="Event date">
                        </div>
                        <div class="text-field-item">
                            <label for="startTimeInput" class="text-field-label">Start Time</label>
                            <select id="startTimeInput" aria-label="Event start time">
                                <!-- Options generated dynamically by JavaScript -->
                            </select>
                        </div>
                        <div class="text-field-item">
                            <label for="endTimeInput" class="text-field-label">End Time</label>
                            <select id="endTimeInput" aria-label="Event end time">
                                <!-- Options generated dynamically by JavaScript -->
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3>🎛️ Controls</h3>
                    <div class="control-group">
                        <label for="aspectRatio">Image Format</label>
                        <select id="aspectRatio" aria-label="Canvas aspect ratio">
                            <option value="9:16">Instagram Story</option>
                            <option value="4:5">Instagram/Facebook Post</option>
                            <option value="1:1">Mixcloud Show Image</option>
                            <option value="obs-hd">Video Stream for OBS</option>
                        </select>
                    </div>
                    <div class="control-group scale-control">
                        <div class="size-controls">
                            <div>
                                <label for="scaleSlider">Image Scale</label>
                                <input type="range" id="scaleSlider" min="50" max="200" value="100" aria-label="Image scale percentage">
                            </div>
                            <span id="scaleValue">100%</span>
                        </div>
                    </div>
                    <div class="control-group opacity-control">
                        <div class="size-controls">
                            <div>
                                <label for="opacitySlider">Gradient Opacity</label>
                                <input type="range" id="opacitySlider" min="0" max="100" value="30" aria-label="Gradient opacity percentage">
                            </div>
                            <span id="opacityValue">30%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <div class="download-section top-right" id="downloadSection" style="display: none;">
                    <button class="btn btn-primary" id="downloadBtn" aria-label="Download the generated event image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                </div>
                <div id="canvasArea">
                    <div class="empty-state">
                        <div class="empty-state-icon">📸</div>
                        <h4>Upload an image to get started</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
