<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vers Libre Editor - Standalone Demo</title>

    <!-- Import the compiled library CSS -->
    <link rel="stylesheet" href="../dist/vers-libre-editor.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .controls {
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .controls button {
            margin: 5px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #0056b3;
        }

        #editor-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Vers Libre Editor - Standalone Demo</h1>
    <p>This demonstrates using the Vers Libre Editor as a standalone component library.</p>

    <div class="controls">
        <h3>Actions</h3>
        <button onclick="loadSampleProject()">Load Sample Project</button>
        <button onclick="getProjectData()">Get Project Data</button>
        <button onclick="exportImage()">Export Image</button>
        <button onclick="destroyEditor()">Destroy Editor</button>
        <button onclick="reinitEditor()">Reinitialize Editor</button>
    </div>

    <div id="editor-container"></div>

    <div class="status">
        <strong>Status Log:</strong>
        <pre id="log"></pre>
    </div>

    <!-- Import the compiled library (UMD format for browser) -->
    <script src="../dist/vers-libre-editor.umd.js"></script>

    <script>
        // Global editor instance
        let editor;

        // Logger helper
        function log(message, data) {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;

            if (data) {
                logEl.textContent += `${entry}\n${JSON.stringify(data, null, 2)}\n\n`;
            } else {
                logEl.textContent += `${entry}\n`;
            }

            logEl.scrollTop = logEl.scrollHeight;
        }

        // Initialize editor on page load
        document.addEventListener('DOMContentLoaded', () => {
            initEditor();
        });

        function initEditor() {
            const container = document.getElementById('editor-container');

            // Configuration options
            const config = {
                standalone: true,
                readonly: false,
                features: {
                    upload: true,
                    download: true,
                    formats: ['4:5', '9:16', '1:1', 'obs-hd'],
                    heicSupport: true
                },
                theme: 'light',
                callbacks: {
                    onReady: (instance) => {
                        log('Editor ready', { config: instance.config });
                    },
                    onError: (error) => {
                        log('Error occurred', error);
                        alert('Error: ' + error.message);
                    }
                }
            };

            // Create editor instance using the UMD global
            editor = new VersLibreEditor.VersLibreEditorComponent(container, config);

            // Listen to events
            editor.on('image:uploaded', (data) => {
                log('Image uploaded', data);
            });

            editor.on('image:loading', (data) => {
                log('Image loading', data);
            });

            editor.on('image:exported', (data) => {
                log('Image exported', {
                    filename: data.filename,
                    format: data.format,
                    size: data.blob?.size
                });
            });

            editor.on('project:loaded', (data) => {
                log('Project loaded', data);
            });

            log('Editor initialized');
        }

        function loadSampleProject() {
            const sampleProject = {
                id: 'demo-123',
                title: 'Sample Event',
                format: '4:5',
                image: {
                    offsetX: 0,
                    offsetY: 0,
                    scale: 1.0
                },
                text: {
                    line1: 'Sample Event Title',
                    line2: 'Secondary Line',
                    date: '2025-12-01',
                    startTime: '18:00',
                    endTime: '22:00'
                },
                settings: {
                    gradientOpacity: 30,
                    showLogo: true
                }
            };

            editor.loadProject(sampleProject);
            log('Loading sample project', sampleProject);
        }

        function getProjectData() {
            const data = editor.getProjectData();
            log('Current project data', data);
        }

        function exportImage() {
            // The editor will emit 'image:exported' event
            editor.exportImage();
            log('Exporting image...');
        }

        function destroyEditor() {
            if (editor) {
                editor.destroy();
                log('Editor destroyed');
                editor = null;
            }
        }

        function reinitEditor() {
            destroyEditor();
            setTimeout(() => {
                initEditor();
            }, 100);
        }
    </script>
</body>
</html>
